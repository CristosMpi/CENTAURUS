name: Python tests

on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install -r requirements-dev.txt
      - name: Check V4 code
        run: |
          ruff check app_v4 scripts/abyssal.py tests/test_v4_api.py tests/test_v4_toolkit.py
          ruff format --check app_v4 scripts/abyssal.py tests/test_v4_api.py tests/test_v4_toolkit.py
      - name: Run tests
        run: pytest -q
      - name: Audit runtime dependencies
        run: pip-audit --strict --disable-pip --no-deps -r requirements-lock.txt
